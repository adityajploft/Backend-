# docs/user.yaml
tags:
  - name: User
    description: Operations related to the authenticated user

paths:
  /api/user/preferences:
    put:
      summary: Update the authenticated user's preferences
      tags: [User]
      description: Requires the final session token from login/registration as a Bearer token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allowCalendarAccess: { type: boolean, example: true }
                allowNotifications: { type: boolean, example: true }
                allowContactsAccess: { type: boolean, example: false }
      responses:
        '200':
          description: Preferences updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Preferences updated successfully." }
                  preferences:
                    type: object
                    properties:
                      allowCalendarAccess: { type: boolean }
                      allowNotifications: { type: boolean }
                      allowContactsAccess: { type: boolean }
        '401':
          description: Unauthorized (Token is missing or invalid).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'